name: Release

# Publishing happens here, never from a laptop: the tag is the record of what was
# released, and the token stays in the repo rather than on someone's machine.
#
#   npm version patch && git push --follow-tags
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # provenance, which npm records against this workflow run

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - run: npm test

      # The tag and the manifest must agree, or the tag stops being the record.
      - name: Tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          packaged=$(node -p "require('./package.json').version")
          if [ "$tagged" != "$packaged" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json $packaged"
            exit 1
          fi

      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
